<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏全球发行策略引擎</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f7f7f5;
    --bg3: #f0efeb;
    --text: #1a1a18;
    --text2: #6b6a64;
    --text3: #9c9a92;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.18);
    --border3: rgba(0,0,0,0.28);
    --radius-md: 8px;
    --radius-lg: 12px;
    --poe-color: #5F5E5A;
    --poe-bg: #F1EFE8;
    --poe-border: #5F5E5A;
    --vr-color: #534AB7;
    --vr-bg: #EEEDFE;
    --vr-border: #534AB7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #242422;
      --bg3: #2c2c2a;
      --text: #e8e6de;
      --text2: #9c9a92;
      --text3: #6b6a64;
      --border: rgba(255,255,255,0.10);
      --border2: rgba(255,255,255,0.18);
      --border3: rgba(255,255,255,0.28);
      --poe-color: #B4B2A9;
      --poe-bg: #2c2c2a;
      --vr-color: #AFA9EC;
      --vr-bg: #26215C;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif; background: var(--bg3); color: var(--text); line-height: 1.5; min-height: 100vh; }

  /* Layout */
  .page { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: var(--bg2); border-right: 0.5px solid var(--border); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.5rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .main { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; max-width: 1100px; }

  /* Header */
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .page-header h1 { font-size: 18px; font-weight: 500; color: var(--text); }
  .page-header p { font-size: 12px; color: var(--text2); margin-top: 3px; }
  .version-badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; background: var(--bg3); color: var(--text2); border: 0.5px solid var(--border); white-space: nowrap; }

  /* Game Switch */
  .game-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .game-btn { padding: 12px 14px; border-radius: var(--radius-lg); border: 0.5px solid var(--border); background: var(--bg); cursor: pointer; text-align: left; transition: all .15s; display: flex; flex-direction: column; gap: 3px; }
  .game-btn:hover { border-color: var(--border2); }
  .game-btn.active-poe { border: 2px solid var(--poe-border); background: var(--poe-bg); }
  .game-btn.active-vr  { border: 2px solid var(--vr-border);  background: var(--vr-bg); }
  .gb-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .gb-sub  { font-size: 11px; color: var(--text2); }
  .gb-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; align-self: flex-start; margin-top: 3px; }
  .poe-badge { background: var(--poe-bg); color: var(--poe-color); border: 0.5px solid var(--poe-border); }
  .vr-badge  { background: var(--vr-bg);  color: var(--vr-color);  border: 0.5px solid var(--vr-border); }

  /* Sidebar filters */
  .sb-section { display: flex; flex-direction: column; gap: 4px; }
  .sb-title { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px 6px; }
  .sb-item { font-size: 13px; color: var(--text2); padding: 6px 10px; border-radius: var(--radius-md); cursor: pointer; transition: background .12s; }
  .sb-item:hover { background: var(--bg3); color: var(--text); }
  .sb-item.active { background: var(--bg); color: var(--text); font-weight: 500; border: 0.5px solid var(--border2); }
  .sb-item.active-poe-sel { background: var(--poe-bg); color: var(--poe-color); font-weight: 500; border: 0.5px solid var(--poe-border); }
  .sb-item.active-vr-sel  { background: var(--vr-bg);  color: var(--vr-color);  font-weight: 500; border: 0.5px solid var(--vr-border); }
  .sb-footer { margin-top: auto; padding-top: 12px; border-top: 0.5px solid var(--border); font-size: 11px; color: var(--text3); line-height: 1.6; }

  /* DNA Panel */
  .dna-panel { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg); }
  .dna-header { padding: 12px 16px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dna-header h3 { font-size: 13px; font-weight: 500; }
  .dna-header span { font-size: 11px; color: var(--text2); }
  .dna-grid { display: grid; grid-template-columns: 110px 1fr; }
  .dna-label { padding: 9px 16px; color: var(--text2); border-bottom: 0.5px solid var(--border); background: var(--bg2); display: flex; align-items: center; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; line-height: 1.4; }
  .dna-val   { padding: 9px 16px; color: var(--text);  border-bottom: 0.5px solid var(--border); font-size: 12px; display: flex; align-items: center; line-height: 1.5; }
  .dna-last .dna-label, .dna-last .dna-val { border-bottom: none; }

  /* Pill filters */
  .filter-block { display: flex; flex-direction: column; gap: 7px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .f-label { font-size: 11px; color: var(--text2); min-width: 30px; }
  .pill { font-size: 11px; padding: 4px 10px; border-radius: 12px; cursor: pointer; border: 0.5px solid var(--border); background: var(--bg); color: var(--text2); transition: all .12s; white-space: nowrap; user-select: none; }
  .pill:hover { border-color: var(--border2); color: var(--text); }
  .pill.on-neutral { background: var(--text2); color: var(--bg); border-color: transparent; }
  .pill.on-poe     { background: var(--poe-color); color: #fff; border-color: var(--poe-color); }
  .pill.on-vr      { background: var(--vr-color);  color: #fff; border-color: var(--vr-color); }

  /* Divider */
  .divider { height: 0.5px; background: var(--border); }

  /* Meta */
  .meta-row { display: flex; align-items: center; justify-content: space-between; }
  .meta-txt { font-size: 12px; color: var(--text2); }
  .meta-txt strong { color: var(--text); font-weight: 500; }

  /* Card grid */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .scard { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; cursor: pointer; transition: border-color .12s; display: flex; flex-direction: column; gap: 8px; }
  .scard:hover { border-color: var(--border2); }
  .scard.open { border-color: var(--border3); }
  .sc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .sc-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .chev { font-size: 11px; color: var(--text2); flex-shrink: 0; transition: transform .15s; margin-top: 2px; }
  .scard.open .chev { transform: rotate(180deg); }
  .tag-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
  .t-poe  { background: #F1EFE8; color: #5F5E5A; }
  .t-vr   { background: #EEEDFE; color: #534AB7; }
  .t-phase   { background: #E1F5EE; color: #085041; }
  .t-region  { background: #E6F1FB; color: #185FA5; }
  .t-plat    { background: #FAEEDA; color: #633806; }
  .t-aud     { background: #FAECE7; color: #712B13; }
  .sc-summary { font-size: 12px; color: var(--text2); line-height: 1.6; padding-top: 8px; border-top: 0.5px solid var(--border); }
  .sc-body { display: none; flex-direction: column; gap: 10px; }
  .scard.open .sc-body { display: flex; }
  .slabel { font-size: 10px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .tlist { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .tlist li { font-size: 12px; color: var(--text); padding-left: 12px; position: relative; line-height: 1.5; }
  .tlist li::before { content: "·"; position: absolute; left: 2px; color: var(--text2); }
  .vguide { border-left: 2px solid var(--border2); padding-left: 10px; }
  .vguide p { font-size: 12px; color: var(--text2); line-height: 1.6; }
  .gene-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .gene-box { border-radius: var(--radius-md); padding: 7px 10px; border: 0.5px solid var(--border); background: var(--bg2); }
  .gene-box .gl { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .gene-box .gv { font-size: 11px; color: var(--text); line-height: 1.4; }
  .empty { grid-column: 1 / -1; padding: 3rem; text-align: center; font-size: 13px; color: var(--text2); }

  @media (max-width: 768px) {
    .page { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 1rem; gap: 1rem; }
    .sb-footer { display: none; }
    .main { padding: 1rem; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sb-section">
      <div class="sb-title">游戏切换</div>
      <div class="game-switch" style="grid-template-columns:1fr">
        <button class="game-btn active-poe" id="btn-poe" onclick="setGame('poe')">
          <span class="gb-name">Path of Exile 2</span>
          <span class="gb-sub">Hardcore ARPG · GGG</span>
          <span class="gb-badge poe-badge">数值 / BD 驱动</span>
        </button>
        <button class="game-btn" id="btn-vr" onclick="setGame('vr')">
          <span class="gb-name">V Rising</span>
          <span class="gb-sub">Survival Crafting · Stunlock</span>
          <span class="gb-badge vr-badge">生存 / 建造 驱动</span>
        </button>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-title">产品阶段</div>
      <div class="sb-item active" data-dim="phase" data-val="all" onclick="sbClick(this)">全部</div>
      <div class="sb-item" data-dim="phase" data-val="CBT" onclick="sbClick(this)">Closed Beta</div>
      <div class="sb-item" data-dim="phase" data-val="EA" onclick="sbClick(this)">Early Access</div>
      <div class="sb-item" data-dim="phase" data-val="Soft" onclick="sbClick(this)">Soft Launch</div>
      <div class="sb-item" data-dim="phase" data-val="Global" onclick="sbClick(this)">Global Launch</div>
    </div>

    <div class="sb-section">
      <div class="sb-title">用户圈层</div>
      <div class="sb-item active" data-dim="audience" data-val="all" onclick="sbClick(this)">全部</div>
      <div class="sb-item" data-dim="audience" data-val="Core" onclick="sbClick(this)">Core 硬核</div>
      <div class="sb-item" data-dim="audience" data-val="Mid" onclick="sbClick(this)">Mid-core 次核心</div>
      <div class="sb-item" data-dim="audience" data-val="Mass" onclick="sbClick(this)">Mass 泛大众</div>
    </div>

    <div class="sb-footer">
      游戏发行策略引擎 v1.0<br>
      PoE 2 · V Rising · 双游戏基因档案<br>
      全生命周期素材经理专用
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="page-header">
      <div>
        <h1>游戏全球发行策略引擎</h1>
        <p>阶段 × 区域 × 平台 × 圈层 · 四维素材策略矩阵</p>
      </div>
      <span class="version-badge">v1.0 · 2025</span>
    </div>

    <!-- DNA Panel -->
    <div class="dna-panel" id="dna-panel"></div>

    <!-- Filters -->
    <div class="filter-block">
      <div class="pill-row">
        <span class="f-label">区域</span>
        <span class="pill on-neutral" data-dim="region" data-val="all" onclick="fp(this)">全部</span>
        <span class="pill" data-dim="region" data-val="NA" onclick="fp(this)">北美</span>
        <span class="pill" data-dim="region" data-val="WEU" onclick="fp(this)">西欧</span>
        <span class="pill" data-dim="region" data-val="EEU" onclick="fp(this)">东欧</span>
        <span class="pill" data-dim="region" data-val="SEA" onclick="fp(this)">东南亚</span>
        <span class="pill" data-dim="region" data-val="CN" onclick="fp(this)">中国大陆</span>
      </div>
      <div class="pill-row">
        <span class="f-label">平台</span>
        <span class="pill on-neutral" data-dim="platform" data-val="all" onclick="fp(this)">全部</span>
        <span class="pill" data-dim="platform" data-val="Twitch" onclick="fp(this)">Twitch</span>
        <span class="pill" data-dim="platform" data-val="YouTube" onclick="fp(this)">YouTube</span>
        <span class="pill" data-dim="platform" data-val="IGN" onclick="fp(this)">IGN / 媒体</span>
        <span class="pill" data-dim="platform" data-val="TikTok" onclick="fp(this)">TikTok</span>
        <span class="pill" data-dim="platform" data-val="Bilibili" onclick="fp(this)">B站</span>
        <span class="pill" data-dim="platform" data-val="Douyin" onclick="fp(this)">抖音</span>
      </div>
    </div>

    <div class="divider"></div>
    <div class="meta-row">
      <span class="meta-txt" id="meta-txt"></span>
    </div>
    <div class="card-grid" id="grid"></div>
  </div>
</div>

<script>
const GAMES = {
  poe: {
    id: 'poe', name: 'Path of Exile 2',
    dna: [

      { dim: '视觉 DNA', val: '哥特华丽：蓝紫色调、优雅暗黑、流光魔法特效、精致建筑结构' },

let game = 'poe';
const F = { phase: 'all', region: 'all', platform: 'all', audience: 'all' };

function setGame(g) {
  game = g;
  document.getElementById('btn-poe').className = 'game-btn' + (g === 'poe' ? ' active-poe' : '');
  document.getElementById('btn-vr').className  = 'game-btn' + (g === 'vr'  ? ' active-vr'  : '');
  renderDNA();
  syncPills();
  render();
}

function renderDNA() {
  const g = GAMES[game];
  const col = game === 'poe' ? '#5F5E5A' : '#534AB7';
  const rows = g.dna.map((r, i) => `
    <div class="${i === g.dna.length - 1 ? 'dna-last' : ''}">
      <div class="dna-label">${r.dim}</div>
    </div>
    <div class="${i === g.dna.length - 1 ? 'dna-last' : ''}">
      <div class="dna-val">${r.val}</div>
    </div>`).join('');
  document.getElementById('dna-panel').innerHTML = `
    <div class="dna-header">
      <h3 style="color:${col}">${g.name} — 游戏基因档案</h3>
      <span>${g.dna[0].val.split('—')[0].trim()}</span>
    </div>
    <div class="dna-grid">${rows}</div>`;
}

function sbClick(el) {
  const dim = el.dataset.dim, val = el.dataset.val;
  document.querySelectorAll(`.sb-item[data-dim="${dim}"]`).forEach(e => e.className = 'sb-item');
  el.className = 'sb-item active';
  F[dim] = val;
  render();
}

function fp(el) {
  const dim = el.dataset.dim, val = el.dataset.val;
  F[dim] = val;
  syncPills();
  render();
}

function syncPills() {
  const onClass = game === 'poe' ? 'on-poe' : 'on-vr';
  document.querySelectorAll('.pill').forEach(p => {
    p.className = 'pill';
    if (p.dataset.val === F[p.dataset.dim]) {
      p.classList.add(p.dataset.val === 'all' ? 'on-neutral' : onClass);
    }
  });
}

function tgl(i) { document.getElementById('c' + i).classList.toggle('open'); }

function render() {
  const f = DATA.filter(d =>
    d.game === game &&
    (F.phase    === 'all' || d.phase    === F.phase) &&
    (F.region   === 'all' || d.region   === F.region) &&
    (F.platform === 'all' || d.platform === F.platform) &&
    (F.audience === 'all' || d.audience === F.audience)
  );
  document.getElementById('meta-txt').innerHTML =
    `<strong>${f.length}</strong> 条策略 · 当前游戏：${GAMES[game].name}`;
  if (!f.length) {
    document.getElementById('grid').innerHTML = '<div class="empty">暂无符合条件的策略，请调整筛选器或切换游戏</div>';
    return;
  }
  const gTag = game === 'poe'
    ? '<span class="tag t-poe">PoE 2</span>'
    : '<span class="tag t-vr">V Rising</span>';
  document.getElementById('grid').innerHTML = f.map((d, i) => `
    <div class="scard" id="c${i}" onclick="tgl(${i})">
      <div class="sc-head">
        <span class="sc-title">${d.hook}</span>
        <span class="chev">▾</span>
      </div>
      <div class="tag-row">
        ${gTag}
        <span class="tag t-phase">${d.phase}</span>
        <span class="tag t-region">${d.region}</span>
        <span class="tag t-plat">${d.platform}</span>
        <span class="tag t-aud">${d.audience}</span>
      </div>
      <div class="sc-summary">${d.summary}</div>
      <div class="sc-body">
        <div>
          <div class="slabel">核心执行动作</div>
          <ul class="tlist">${d.tactics.map(t => `<li>${t}</li>`).join('')}</ul>
        </div>
        <div>
          <div class="slabel">视觉指导（素材经理专用）</div>
          <div class="vguide"><p>${d.visual}</p></div>
        </div>
        <div class="gene-strip">
          ${Object.entries(d.gene).map(([k,v]) =>
            `<div class="gene-box"><div class="gl">${k}</div><div class="gv">${v}</div></div>`
          ).join('')}
        </div>
      </div>
    </div>`).join('');
}

renderDNA();
syncPills();
render();
